name: Deploy to GitHub Pages

on:
    push:
        branches: [ main ]

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '18'
              cache: 'npm'
              cache-dependency-path: ./Weather_App/package-lock.json

        - name: Install dependencies
          run: npm install
          working-directory: ./Weather_App
          
        - name: Build
          run: npm run build
          working-directory: ./Weather_App

        - name: Setup Pages
          uses: actions/configure-pages@v4

        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: ./Weather_App/dist

        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4