<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sales Dashboard</h1>
        <div class="controls">
            <label>From <input id="startDate" type="date"></label>
            <label>To <input id="endDate" type="date"></label>
            <label>Region
                <select id="regionFilter">
                    <option value="all">All</option>
                    <option value="North">North</option>
                    <option value="South">South</option>
                    <option value="East">East</option>
                    <option value="West">West</option>
                </select>
            </label>
            <button id="refreshBtn">Refresh</button>
        </div>
    </header>

    <section id="overview" class="card">
        <strong>Overview</strong>
        <div id="summary">
            <div><div>Total sales</div><div id="totalSales">£0</div></div>
            <div><div>Orders</div><div id="ordersCount">£0</div></div>
            <div><div>Avg Order Value</div><div id="avgOrder"></div></div>
        </div>
    </section>

    <section id="charts">
        <div class="card"><Strong>Monthly Sales</Strong><canvas id="salesTrend"></canvas></div>
        <div class="card"><Strong>Sales by Category</Strong><canvas id="salesByCategory"></canvas></div>
        <div class="card"><Strong>Top Products</Strong><canvas id="topProducts"></canvas></div>
        <div class="card"><Strong>Sales by Region</Strong><canvas id="salesByRegion"></canvas></div>
    </section>

    <section class="card">
        <strong>Recent Orders</strong>
        <table id="ordersTable">
            <thead><tr><th>Order ID</th><th>Date</th><th>Product</th><th>Qty</th><th>Total</th><th>Region</th></thead>
            <tbody></tbody>
        </table>
    </section>

    <footer>
        Built with Chart.js | SQL queries in <code>queries.sql</code> | Tableau workbook: <code>dashboard.twb</code>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
